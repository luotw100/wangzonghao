name: Build Desktop App

# Manual only — never auto-triggers. Publishes to a GitHub *draft* release
# (release storage is separate from the Actions artifact quota). Version /
# tag come from desktop/package.json.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

permissions:
  contents: write

jobs:
  # Create the draft release once, up front, so the two build jobs can run
  # in parallel and just upload assets into it (no race to create it).
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes "Automated draft build."

  mac-arm64:
    needs: prepare-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run build
      - name: Freeze Python sidecar
        run: ./build_sidecar_mac.sh
        working-directory: desktop/sidecar
      - name: electron-builder (publish draft)
        run: npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-x64:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run build
      - name: Freeze Python sidecar
        run: ./build_sidecar_win.ps1
        working-directory: desktop/sidecar
        shell: pwsh
      - name: electron-builder (publish draft)
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
