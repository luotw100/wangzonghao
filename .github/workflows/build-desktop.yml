name: Build Desktop App

# Manual only — never auto-triggers. Publishes to a GitHub *draft* release
# (release storage is separate from the Actions artifact quota). Version /
# tag come from desktop/package.json.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run build
      - name: Freeze Python sidecar
        run: ./build_sidecar_mac.sh
        working-directory: desktop/sidecar
      - name: electron-builder (publish draft)
        run: npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-x64:
    # Serialized after mac so both jobs append to the same draft release
    # instead of racing to create it.
    needs: mac-arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run build
      - name: Freeze Python sidecar
        run: ./build_sidecar_win.ps1
        working-directory: desktop/sidecar
        shell: pwsh
      - name: electron-builder (publish draft)
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
