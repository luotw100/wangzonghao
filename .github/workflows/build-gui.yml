name: Build Bridge GUI

# Manual only — never auto-triggers.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

defaults:
  run:
    working-directory: bridge/cli

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: pwsh
        run: ./scripts/build_gui_win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LaborsterBridge-${{ github.event.inputs.version }}-win-x64
          path: bridge/cli/dist/LaborsterBridge.exe
          if-no-files-found: error

  mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app
        run: ./scripts/build_gui_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LaborsterBridge-${{ github.event.inputs.version }}-mac-arm64
          path: bridge/cli/dist/LaborsterBridge-mac-arm64.zip
          if-no-files-found: error
