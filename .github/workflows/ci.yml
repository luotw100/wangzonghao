name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支的新 push 取消仍在跑的旧 run，省 CI 分钟数。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 后端集成测试：拉起整套 compose 栈（不含 cloudflared / web 前端），跑两套：
  #   1) services/api 的 pytest（在 user-api 容器里，真实 HTTP，无 mock）
  #   2) sidecar 的 StudioClient 集成测试（一次性 python 容器接入 compose 网络，打真实 user-api）
  # ---------------------------------------------------------------------
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # .env 被 gitignore，CI 现造一份测试用配置。值随便填，栈是一次性的。
      # COMPOSE_PROJECT_NAME 固定成 ci，让下面创建的 external 卷名可预测。
      - name: Write test .env
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=ci
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=laborster
          DATABASE_URL=postgresql://ci:ci@db:5432/laborster
          MINIO_ROOT_USER=ciminio
          MINIO_ROOT_PASSWORD=ciminio123
          S3_BUCKET=media
          S3_PUBLIC_URL=http://minio:9000/media
          UPLOAD_MAX_SIZE_MB=50
          PORTAL_ORIGINS=http://localhost
          CF_TUNNEL_TOKEN=unused-in-ci
          EOF

      # 有状态卷在 docker-compose.yaml 里声明成 external，compose 不会自动建。
      # 一次性 CI runner 上手动建出这五个 ${COMPOSE_PROJECT_NAME}_* 卷。
      - name: Create external stateful volumes
        run: |
          for v in pgdata minio-data caddy-data caddy-config; do
            docker volume create "ci_$v"
          done

      # 只起测试需要的服务，跳过 cloudflared / caddy（要真 token）和 admin-web。
      - name: Bring up stack
        run: |
          docker compose --env-file .env up --build -d \
            db minio minio-create-buckets migrate \
            user-api admin-api user-worker fake-llm

      - name: Run API pytest (services/api, in user-api)
        run: |
          docker compose --env-file .env exec -T user-api \
            uv run python -m pytest tests/ -v

      # sidecar 客户端代码打真实 user-api：用一次性 uv 官方镜像接到 compose
      # 默认网络（COMPOSE_PROJECT_NAME=ci → ci_default）。`uv sync --frozen`
      # 从 uv.lock 装锁定依赖 + test 组（顺带在 CI 验证锁能解析），venv 落在
      # /tmp 不污染挂载源；容器内能解析 user-api / admin-api，跑完即弃。
      - name: Run sidecar integration tests
        run: |
          docker run --rm --network ci_default \
            -e STUDIO_BASE_URL=http://user-api:23456 \
            -e ADMIN_BASE_URL=http://admin-api:23457 \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv \
            -v "$PWD/desktop/sidecar:/sidecar" \
            -w /sidecar \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
            sh -c "uv sync --frozen --group test && uv run --no-sync pytest tests/integration -v"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --env-file .env down -v

  # ---------------------------------------------------------------------
  # 前端：admin React 应用跑 eslint + tsc/vite 构建检查。（用户侧界面已并入
  # 桌面应用；公开站点是 services/portal 的静态文件，无构建步骤。）
  # ---------------------------------------------------------------------
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [admin_web]
    defaults:
      run:
        working-directory: services/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
