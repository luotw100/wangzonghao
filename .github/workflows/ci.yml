name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支的新 push 取消仍在跑的旧 run，省 CI 分钟数。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 后端集成测试：拉起整套 compose 栈（不含 cloudflared / web 前端），跑两套：
  #   1) services/api 的 pytest（在 user-api 容器里，真实 HTTP，无 mock）
  #   2) sidecar 的 StudioClient 集成测试（在 bridge-host 容器里，打真实 user-api）
  # ---------------------------------------------------------------------
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # .env 被 gitignore，CI 现造一份测试用配置。值随便填，栈是一次性的。
      - name: Write test .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=laborster
          DATABASE_URL=postgresql://ci:ci@db:5432/laborster
          MINIO_ROOT_USER=ciminio
          MINIO_ROOT_PASSWORD=ciminio123
          S3_BUCKET=media
          S3_PUBLIC_URL=http://minio:9000/media
          UPLOAD_MAX_SIZE_MB=50
          CF_TUNNEL_TOKEN=unused-in-ci
          EOF

      # 只起测试需要的服务，跳过 cloudflared（要真 token）和 user-web/admin-web。
      - name: Bring up stack
        run: |
          docker compose --env-file .env up --build -d \
            db minio minio-create-buckets migrate \
            user-api admin-api user-worker bridge-host fake-llm

      - name: Run API pytest (services/api, in user-api)
        run: |
          docker compose --env-file .env exec -T user-api \
            uv run python -m pytest tests/ -v

      # sidecar 自己的客户端代码打真实 user-api：在 bridge-host 容器里跑——
      # 它已 pip install laborster_bridge 包，且在 compose 内网能解析
      # user-api / admin-api。tests/ 随 `COPY desktop/sidecar` 进了镜像。
      - name: Run sidecar integration tests (in bridge-host)
        run: |
          docker compose --env-file .env exec -T bridge-host \
            pip install --no-cache-dir --quiet pytest
          docker compose --env-file .env exec -T \
            -e STUDIO_BASE_URL=http://user-api:23456 \
            -e ADMIN_BASE_URL=http://admin-api:23457 \
            bridge-host python -m pytest /opt/sidecar/tests/integration -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --env-file .env down -v

  # ---------------------------------------------------------------------
  # 前端：两个 React 应用各跑 eslint + tsc/vite 构建检查。
  # ---------------------------------------------------------------------
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [user_web, admin_web]
    defaults:
      run:
        working-directory: services/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
