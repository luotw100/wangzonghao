name: Desktop Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false   # let both platforms complete even if one fails
      matrix:
        include:
          - os: macos-14          # arm64 M1
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # LTS; avoids Node 20 deprecation warning
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Rebuild native modules (better-sqlite3) for Electron's Node ABI
      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build renderer + main
        run: npm run build

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: npm run dist:mac
        # No signing: unsigned DMG, bypass Gatekeeper with:
        #   xattr -rd com.apple.quarantine /Applications/Laborster\ Bridge.app

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npm run dist:win
        # No signing: SmartScreen warns on first launch, click "More info → Run anyway"

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: LaborsterBridge-mac
          path: desktop/dist-release/*.zip
          retention-days: 14

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: LaborsterBridge-win
          path: desktop/dist-release/*.exe
          retention-days: 14

  # Create a draft GitHub Release and attach both binaries
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: "Laborster Bridge desktop-v${{ github.run_number }}"
          draft: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
