<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Laborster Bridge · Design</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bridge-tokens.css">
  <style>
    html, body { background: #f0eee9; margin: 0; }
    /* Anything inside an artboard renders our dark surface */
    .dc-artboard-inner { background: var(--bg-deep); color: var(--ink-1); font-family: var(--f-ui); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="screens/shared.jsx"></script>
  <script type="text/babel" src="screens/overview.jsx"></script>
  <script type="text/babel" src="screens/login.jsx"></script>
  <script type="text/babel" src="screens/inbox-config.jsx"></script>
  <script type="text/babel" src="screens/panel.jsx"></script>
  <script type="text/babel" src="screens/tray.jsx"></script>
  <script type="text/babel" src="screens/settings.jsx"></script>
  <script type="text/babel" src="screens/inventory.jsx"></script>

  <script type="text/babel" data-presets="react">
    const App = () => (
      <DesignCanvas storageKey="bridge-design-v1" initialZoom={0.6}>
        <DCSection id="00-overview" title="00 · Laborster Bridge" subtitle="Electron daemon shell · 与 Studio 同源 @theme · 5 屏 · 6 状态">
          <DCArtboard id="cover" label="Cover" width={1200} height={520}>
            <OverviewCover />
          </DCArtboard>
          <DCArtboard id="flow" label="User flow · 首启→配置→运行" width={1280} height={620}>
            <FlowDiagram />
          </DCArtboard>
          <DCArtboard id="screenlist" label="屏幕清单" width={1280} height={500}>
            <ScreenList />
          </DCArtboard>
          <DCArtboard id="constraints" label="桌面窗口约束" width={1280} height={320}>
            <WindowConstraints />
          </DCArtboard>
        </DCSection>

        <DCSection id="01-login" title="01 · 首启登录" subtitle="同 Studio HomePage 两栏 DNA · 缩到 960×640 · 4 状态">
          <DCArtboard id="login-idle" label="A · idle · 第一次启动" width={960} height={640}>
            <LoginIdle />
          </DCArtboard>
          <DCArtboard id="login-connecting" label="B · 握手中 · POST /handshake" width={960} height={640}>
            <LoginConnecting />
          </DCArtboard>
          <DCArtboard id="login-401" label="C · 401 · session 被撤销" width={960} height={640}>
            <LoginError401 />
          </DCArtboard>
          <DCArtboard id="login-down" label="D · Studio 不可达 · 自动重试" width={960} height={640}>
            <LoginStudioDown />
          </DCArtboard>
        </DCSection>

        <DCSection id="02-inbox" title="02 · Inbox 配置" subtitle="把 --chat-inbox CLI 翻成表单 · 同台机器一 Bridge 可挂 N 个 inbox">
          <DCArtboard id="inbox-empty" label="A · 还没挂任何 inbox" width={960} height={640}>
            <InboxEmpty />
          </DCArtboard>
          <DCArtboard id="inbox-adding" label="B · 添加第一个" width={960} height={640}>
            <InboxAdding />
          </DCArtboard>
          <DCArtboard id="inbox-multi" label="C · 多个 inbox + 1 个错误" width={960} height={640}>
            <InboxMulti />
          </DCArtboard>
        </DCSection>

        <DCSection id="03-panel" title="03 · 主状态面板" subtitle="KPI 网格 + Inbox 列表 + mono 日志区 · 5 状态">
          <DCArtboard id="panel-connecting" label="A · connecting · 刚握完手" width={960} height={640}>
            <PanelConnecting />
          </DCArtboard>
          <DCArtboard id="panel-online" label="B · online · 一切正常" width={960} height={640}>
            <PanelOnline />
          </DCArtboard>
          <DCArtboard id="panel-degraded" label="C · degraded · 1 个 inbox 掉线" width={960} height={640}>
            <PanelDegraded />
          </DCArtboard>
          <DCArtboard id="panel-401" label="D · 401 · 需重新登录" width={960} height={640}>
            <PanelOffline401 />
          </DCArtboard>
          <DCArtboard id="panel-toast" label="E · 在线 + 错误 toast (chunk 发送失败)" width={960} height={640}>
            <PanelOnlineWithErrorToast />
          </DCArtboard>
        </DCSection>

        <DCSection id="04-tray" title="04 · 托盘菜单" subtitle="系统状态栏弹出的 mini 控制台 · 4 状态">
          <DCArtboard id="tray-online" label="A · 在线" width={360} height={520}>
            <TrayOnline />
          </DCArtboard>
          <DCArtboard id="tray-degraded" label="B · 降级" width={360} height={520}>
            <TrayDegraded />
          </DCArtboard>
          <DCArtboard id="tray-offline" label="C · 离线 · 需重新登录" width={360} height={520}>
            <TrayOffline />
          </DCArtboard>
          <DCArtboard id="tray-paused" label="D · 手动暂停" width={360} height={520}>
            <TrayPaused />
          </DCArtboard>
        </DCSection>

        <DCSection id="05-settings" title="05 · 设置" subtitle="左 220px 分组导航 + 右内容 · 3 个子页">
          <DCArtboard id="set-general" label="A · 通用" width={960} height={640}>
            <SettingsGeneral />
          </DCArtboard>
          <DCArtboard id="set-network" label="B · 网络与连接" width={960} height={640}>
            <SettingsNetwork />
          </DCArtboard>
          <DCArtboard id="set-logs" label="C · 日志与缓存" width={960} height={640}>
            <SettingsLogs />
          </DCArtboard>
        </DCSection>

        <DCSection id="06-inventory" title="06 · 组件清单" subtitle="可直接从 Studio 借 · Bridge 新加的 · 推荐文件位置">
          <DCArtboard id="inv" label="Component inventory" width={1280} height={1700}>
            <ComponentInventory />
          </DCArtboard>
        </DCSection>

        <DCSection id="07-prototype" title="07 · 可运行原型" subtitle="单文件 React + Tailwind v4 · 复制 paste 到 Electron renderer">
          <DCArtboard id="proto-link" label="→ Bridge Prototype.html" width={1280} height={260}>
            <div style={{ padding: '40px 56px', background: 'var(--bg-deep)', display: 'flex', alignItems: 'center', gap: 28 }}>
              <span className="lab-mark" style={{ width: 36, height: 36, fontSize: 36 }} />
              <div style={{ flex: 1 }}>
                <span className="eyebrow">RUNNABLE PROTOTYPE</span>
                <div className="serif" style={{ fontSize: 26, margin: '4px 0' }}>Bridge Prototype.html</div>
                <div className="text-ink-3" style={{ fontSize: 12.5, lineHeight: 1.7, maxWidth: 720 }}>
                  自包含单文件 · @tailwindcss/browser v4 + React 18 · @theme token 直接来自上面 bridge-tokens.css · 不引任何 UI 库。
                  右上角 Tweaks 可在 6 个状态之间切换；按 <span className="kbd">⌘1</span>–<span className="kbd">⌘5</span> 跳屏。
                </div>
              </div>
              <a href="Bridge Prototype.html" target="_blank" className="btn btn-primary" style={{ textDecoration: 'none' }}>
                打开原型 ↗
              </a>
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
