<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laborster Bridge</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============ HEADER ============ -->
  <header>
    <img id="logo" src="favicon.svg" alt="" width="22" height="22" />
    <span class="brand">Laborster Bridge</span>

    <div class="spacer"></div>

    <div id="acc-menu" class="menu" hidden>
      <button id="acc-trigger" class="menu-trigger">
        <span id="acc-trigger-label">未登录</span>
        <span class="caret">▾</span>
      </button>
      <div id="acc-dropdown" class="menu-dropdown" hidden>
        <div id="acc-list" class="menu-section"></div>
        <div class="menu-sep"></div>
        <button class="menu-item" id="mi-add-account">+ 添加 Studio 账号…</button>
        <button class="menu-item" id="mi-logout">登出当前账号</button>
        <div class="menu-sep"></div>
        <div class="menu-meta">
          <div class="kvline"><span>Studio</span><b id="acc-studio">-</b></div>
          <div class="kvline"><span>machine_id</span><b id="acc-machine">-</b></div>
        </div>
        <button class="menu-item small" id="mi-studio-set">覆盖 Studio 地址…</button>
        <button class="menu-item small" id="mi-studio-reset" hidden>恢复默认 Studio 地址</button>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main>
    <!-- Status strip (only visible once logged in) -->
    <section id="strip" class="strip" hidden>
      <span id="strip-dot" class="dot"></span>
      <span id="strip-label" class="strip-label">-</span>
      <span class="strip-sep">·</span>
      <span id="strip-studio" class="strip-studio">-</span>
      <span class="spacer"></span>
      <span class="strip-metric"><label>近 5min 入站</label><b id="strip-in">0</b></span>
      <span class="strip-metric"><label>待发</label><b id="strip-unsent">0</b></span>
    </section>
    <div id="strip-err" class="strip-err" hidden></div>

    <!-- View: not logged in -->
    <section id="view-login" class="view" hidden>
      <div class="card narrow">
        <h2>登录 Studio</h2>
        <p class="sub">用 Studio 账号密码换取本机 token，bridge 才能把消息转发给 Studio。</p>
        <div class="field">
          <label>用户名</label>
          <input id="login-user" type="text" autocomplete="off" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="login-pass" type="password" autocomplete="off" />
        </div>
        <button id="btn-login" class="primary block">登录</button>
      </div>
    </section>

    <!-- View: logged in, no channels yet -->
    <section id="view-empty" class="view" hidden>
      <div class="empty">
        <div class="empty-icon">🔗</div>
        <h2>绑定第一个 channel</h2>
        <p>选择平台、登录账号，bridge 会把会话桥接到 Studio。</p>
        <button id="btn-empty-add" class="primary lg">+ 绑定 channel</button>
      </div>
    </section>

    <!-- View: normal — channel list -->
    <section id="view-channels" class="view" hidden>
      <div class="section-head">
        <h2>Channels <span id="ch-count" class="pill-count">0</span></h2>
        <button id="btn-ch-add" class="primary sm">+ 绑定</button>
      </div>
      <div id="ch-list" class="cards"></div>
    </section>
  </main>

  <!-- ============ LOG DRAWER ============ -->
  <div id="drawer" class="drawer collapsed">
    <button id="drawer-toggle" class="drawer-toggle">
      <span class="chev">▸</span> 日志
      <span id="drawer-badge" class="badge" hidden>0</span>
      <span class="spacer"></span>
      <button id="btn-opendir" class="link inline">打开数据目录</button>
    </button>
    <div id="drawer-body" class="drawer-body">
      <div class="drawer-controls">
        <label><input type="checkbox" id="filt-err" checked> err</label>
        <label><input type="checkbox" id="filt-warn" checked> warn</label>
        <label><input type="checkbox" id="filt-ok" checked> ok</label>
        <label><input type="checkbox" id="filt-info" checked> info</label>
        <span class="spacer"></span>
        <label><input type="checkbox" id="follow-end" checked> 跟随末尾</label>
        <button id="btn-clear" class="ghost sm">清空</button>
      </div>
      <div id="log" class="log"></div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" hidden></div>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-bg"></div>
    <div class="modal-body">
      <div class="modal-head">
        <h3 id="modal-title">-</h3>
        <button class="modal-close" id="modal-close" aria-label="close">×</button>
      </div>
      <div id="modal-content" class="modal-content"></div>
      <div id="modal-foot" class="modal-foot"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
