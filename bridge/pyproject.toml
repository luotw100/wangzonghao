[project]
name = "laborster-bridge"
version = "0.1.0"
description = "Laborster local relay CLI — logs into chat platforms and bridges private chats to Studio."
requires-python = ">=3.12"
dependencies = ["prompt_toolkit>=3.0", "certifi>=2024.0"]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]

[project.scripts]
laborster-bridge = "laborster_bridge.__main__:main"
lbr = "laborster_bridge.__main__:main"
laborster-bridge-gui = "laborster_bridge.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laborster_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"laborster_bridge/gui/web" = "laborster_bridge/gui/web"
"laborster_bridge/gui/assets" = "laborster_bridge/gui/assets"
