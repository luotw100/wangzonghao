appId: com.laborster.desktop
productName: Laborster
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: sidecar/dist
    to: sidecar
    filter:
      - "laborster-sidecar"
      - "laborster-sidecar.exe"
  - from: build/icon.png
    to: icon.png
asar: true
# Double-click to run, no installer (like the bridge app): mac ships a
# zipped .app, win ships a single portable .exe.
mac:
  category: public.app-category.business
  icon: build/icon.icns
  target:
    - target: zip
      arch: [arm64]
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName}-${version}-win-x64.exe
publish:
  provider: github
  owner: luotw100
  repo: wangzonghao
  releaseType: draft
