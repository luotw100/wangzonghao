appId: com.laborster.bridge
productName: Laborster Bridge
copyright: Copyright © 2026 Laborster

directories:
  output: dist-release
  buildResources: resources

files:
  - out/**
  - resources/**

asar: true
asarUnpack:
  - "**/*.node"  # native modules (better-sqlite3)

mac:
  target:
    # zip, not dmg: hdiutil DMG creation is flaky on CI runners, and the
    # app is unsigned anyway (user runs xattr/codesign manually).
    - target: zip
      arch: [x64, arm64]
  artifactName: LaborsterBridge-${version}-${arch}-mac.zip
  category: public.app-category.productivity

win:
  target:
    - target: portable
      arch: [x64]

portable:
  artifactName: LaborsterBridge-${version}-portable.exe
