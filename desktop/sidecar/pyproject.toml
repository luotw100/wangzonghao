[project]
name = "laborster-bridge"
version = "0.1.0"
description = "Laborster local relay CLI — logs into chat platforms and bridges private chats to Studio."
requires-python = ">=3.12"
dependencies = ["prompt_toolkit>=3.0", "certifi>=2024.0", "urllib3>=2.0"]

# Dev-only tool deps: locked in uv.lock for reproducible builds/tests, but
# never shipped in the wheel (not [project.dependencies]). `test` — unit +
# integration tests; `build` — the PyInstaller freeze toolchain.
[dependency-groups]
test = ["pytest>=8.3.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
laborster-bridge = "laborster_bridge.__main__:main"
lbr = "laborster_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laborster_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import laborster_bridge straight from the source tree — no install step.
pythonpath = ["."]
