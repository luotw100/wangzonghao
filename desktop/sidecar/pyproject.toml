[project]
name = "laborster-bridge"
version = "0.1.0"
description = "Laborster local relay CLI — logs into chat platforms and bridges private chats to Studio."
requires-python = ">=3.12"
dependencies = ["prompt_toolkit>=3.0", "certifi>=2024.0"]

[project.optional-dependencies]
# Local unit tests only (store/events/config). Not installed by the
# bridge-host container (it runs `pip install` without extras), and the
# tests/ dir is excluded from the wheel below.
test = ["pytest>=8.3.0"]

[project.scripts]
laborster-bridge = "laborster_bridge.__main__:main"
lbr = "laborster_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laborster_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import laborster_bridge straight from the source tree — no install step.
pythonpath = ["."]
