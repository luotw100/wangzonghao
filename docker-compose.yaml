services:
  # ---------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_ALLOW_CORS: "true"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-create-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET};
      "
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # API + worker + admin (single image, three entrypoints)
  # ---------------------------------------------------------------------
  migrate:
    build:
      context: services/studio/api
    command: ["uv", "run", "python", "-m", "studio.migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  user-api:
    build:
      context: services/studio/api
    command: ["uv", "run", "uvicorn", "studio.main:app", "--host", "0.0.0.0", "--port", "23456"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  user-worker:
    build:
      context: services/studio/api
    command: ["uv", "run", "python", "-m", "studio.worker", "--request-timeout", "120"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin-api:
    build:
      context: services/studio/api
    command: ["uv", "run", "uvicorn", "admin.app:app", "--host", "0.0.0.0", "--port", "23457"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Web (single React app at user_web; admin is a separate panel)
  # ---------------------------------------------------------------------
  user-web:
    build:
      context: services/studio/user_web
    volumes:
      - ./services/studio/user_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-api:
        condition: service_started
    restart: unless-stopped

  admin-web:
    build:
      context: services/studio/admin_web
    volumes:
      - ./services/studio/admin_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      admin-api:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Tunnel
  # ---------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
