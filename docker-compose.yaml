services:
  # ---------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------
  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_ALLOW_CORS: "true"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-create-buckets:
    profiles: ["storage"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET};
      "
    restart: "no"

  db:
    profiles: ["storage"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # API + worker + admin (single image, three entrypoints)
  # ---------------------------------------------------------------------
  migrate:
    profiles: ["app"]
    build:
      context: services/api
    command: ["uv", "run", "python", "-m", "studio.migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  user-api:
    profiles: ["app"]
    build:
      context: services/api
    # --timeout-keep-alive 75 (> nginx upstream idle 60s) makes nginx the side
    #   that closes pooled idle connections, avoiding reuse-after-close 502s.
    # --workers 4 gives real parallelism (was a single event loop). Safe here:
    #   the LISTEN/NOTIFY broker is per-worker by design (see studio/notify.py).
    command: ["uv", "run", "uvicorn", "studio.main:app", "--host", "0.0.0.0", "--port", "23456", "--timeout-keep-alive", "75", "--workers", "4"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB}
      PORTAL_ORIGINS: ${PORTAL_ORIGINS}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  user-worker:
    profiles: ["app"]
    build:
      context: services/api
    command: ["uv", "run", "python", "-m", "studio.worker", "--request-timeout", "120"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin-api:
    profiles: ["app"]
    build:
      context: services/api
    command: ["uv", "run", "uvicorn", "admin.app:app", "--host", "0.0.0.0", "--port", "23457"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Web: only the admin panel. The user-facing surface is the desktop app;
  # the public site is the static portal served by Caddy (see edge below),
  # and api.laborster.com goes straight to user-api with no web layer.
  # ---------------------------------------------------------------------
  admin-web:
    profiles: ["app"]
    build:
      context: services/admin_web
    volumes:
      - ./services/admin_web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      admin-api:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Fake LLM: tiny stdlib HTTP server impersonating an OpenAI-compatible
  # /chat/completions on hostname `fake-llm`, used by the in-container
  # test suite. Whitelisted in studio.clients.ALLOWED_BASE_URLS.
  # ---------------------------------------------------------------------
  fake-llm:
    profiles: ["app"]
    build:
      context: services/api
    working_dir: /app
    command: ["uv", "run", "python", "/app/tests/fake_llm/server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=1).status==200 else 1)"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Tunnel: admin plane only (admin-web behind Cloudflare Access).
  # The user plane (studio + s3) goes through the frp relay below.
  # ---------------------------------------------------------------------
  cloudflared:
    profiles: ["edge"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Edge: Caddy terminates TLS for the user plane — the static portal
  # (laborster.com), the API (api.laborster.com → user-api) and s3
  # (s3.laborster.com → minio). frpc exposes it through the Seoul frp relay
  # via zero-trust TCP passthrough, so the relay only ever moves ciphertext.
  # See edge/README.md.
  # ---------------------------------------------------------------------
  caddy:
    profiles: ["edge"]
    build:
      context: edge/caddy
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/portal:/srv/portal:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      user-api:
        condition: service_started
    restart: unless-stopped

  frpc:
    profiles: ["edge"]
    image: snowdreamtech/frpc:0.69.0
    environment:
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR}
      FRP_TOKEN: ${FRP_TOKEN}
    volumes:
      - ./edge/frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      caddy:
        condition: service_started
    restart: unless-stopped

# Declared `external` so `docker compose down -v` CANNOT delete them — the
# stateful data survives any accidental teardown. The names interpolate
# COMPOSE_PROJECT_NAME so each instance still gets its own isolated volume
# (release_pgdata, debug_pgdata, ...), matching compose's default naming.
# Trade-off: these are not auto-created; a new instance needs them made once:
#   docker volume create <project>_pgdata  (and the other four)
volumes:
  pgdata:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_pgdata
  minio-data:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_minio-data
  caddy-data:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_caddy-data
  caddy-config:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_caddy-config
