services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "23456:23456"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/app/storage:ro
    depends_on:
      - chat
      - robot-api
      - robot-worker
    restart: unless-stopped

  chat:
    build:
      context: .
    command: uv run uvicorn chat.main:app --host 0.0.0.0 --port 23456
    volumes:
      - app-storage:/app/storage
    restart: unless-stopped

  robot-api:
    build:
      context: .
    command: >
      uv run python -m robot.main
      --host 0.0.0.0 --port 23457
      --chat-api-base-url http://chat:23456/api
      --resend-api-key ${RESEND_API_KEY}
      --resend-from "${RESEND_FROM}"
      --admin-emails "${ADMIN_EMAILS}"
      --cookie-secure ${COOKIE_SECURE}
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      COOKIE_SECURE: ${COOKIE_SECURE}
    volumes:
      - app-storage:/app/storage
    depends_on:
      - chat
    restart: unless-stopped

  robot-worker:
    build:
      context: .
    command: uv run python -m robot.worker --chat-api-base-url http://chat:23456/api --request-timeout 120
    volumes:
      - app-storage:/app/storage
    depends_on:
      - chat
    restart: unless-stopped

volumes:
  app-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/storage