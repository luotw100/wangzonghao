services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "23456:23456"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/app/storage:ro
    depends_on:
      - chat
      - robot-api
      - robot-worker
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  chat:
    build:
      context: .
    command: uv run uvicorn chat.main:app --host 0.0.0.0 --port 23456
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - app-storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped

  robot-api:
    build:
      context: .
    command: uv run python -m robot.main --host 0.0.0.0 --port 23457 --chat-api-base-url http://chat:23456/api
    volumes:
      - app-storage:/app/storage
    depends_on:
      - chat
    restart: unless-stopped

  robot-worker:
    build:
      context: .
    command: uv run python -m robot.worker --chat-api-base-url http://chat:23456/api --redis-url redis://redis:6379/0 --request-timeout 120
    volumes:
      - app-storage:/app/storage
    depends_on:
      - chat
      - redis
    restart: unless-stopped

volumes:
  app-storage:
