<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Agent 调试工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 h-screen flex overflow-hidden">

    <div id="app" class="w-full h-full flex" v-cloak>
        <!-- 左侧边栏 -->
        <div class="w-80 bg-white border-r border-slate-200 flex flex-col">
            <div class="p-4 border-b bg-gradient-to-r from-indigo-500 to-purple-500 flex justify-between items-center">
                <h1 class="text-lg font-bold text-white">工作台</h1>
                <button @click="showCreateRobotModal = true" class="text-sm bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg transition">➕ Robot</button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <!-- Robot 列表 -->
                <div v-for="robot in robots" :key="robot.id" class="border-b border-slate-100">
                    <!-- Robot 一级标题（可折叠） -->
                    <div class="flex items-center gap-2">
                        <button @click="toggleRobot(robot.id)" class="w-full p-3 bg-indigo-50 text-sm font-bold text-indigo-700 flex items-center justify-between hover:bg-indigo-100 transition">
                            <div class="flex items-center gap-2">
                                <span>{{ collapsedRobots[robot.id] ? '▶️' : '🔽' }}</span>
                                <span>🤖 {{ robot.name }}</span>
                            </div>
                            <button @click.stop="openEditRobotModal(robot)" class="text-xs text-indigo-400 hover:text-indigo-600 p-1" title="编辑">✏️</button>
                        </button>
                        <button @click="createConversation(robot.id)" class="mr-2 text-xs bg-indigo-500 text-white px-2 py-1 rounded hover:bg-indigo-600 transition">➕</button>
                    </div>

                    <!-- 会话列表（可折叠） -->
                    <div v-if="!collapsedRobots[robot.id]">
                        <div v-for="conv in conversations.filter(c => c.robot_id === robot.id)" :key="conv.id"
                             @click="selectConversation(conv.id)"
                             :class="['pl-6 pr-3 py-2 border-b border-slate-50 cursor-pointer hover:bg-slate-50 transition text-sm', activeConvId === conv.id ? 'bg-indigo-50/50 border-l-4 border-l-indigo-300' : '']">
                            <div class="text-slate-600 truncate">{{ conv.title }}</div>
                            <div class="text-xs text-slate-300 mt-0.5">{{ formatDate(conv.updated_at) }}</div>
                        </div>
                        <div v-if="conversations.filter(c => c.robot_id === robot.id).length === 0" class="pl-6 pr-3 py-2 text-slate-300 text-xs">
                            暂无会话
                        </div>
                    </div>
                </div>

                <!-- 无 Robot 时提示 -->
                <div v-if="robots.length === 0" class="p-8 text-center text-slate-400">
                    <p class="text-4xl mb-3">🛠️</p>
                    <p>还没有 Robot</p>
                    <p class="text-sm mt-1">点击右上角 ➕ Robot 创建</p>
                </div>
            </div>
        </div>

        <!-- 右侧聊天区 -->
        <div class="flex-1 flex flex-col bg-slate-50 relative">
            <template v-if="activeConvId">
                <!-- 聊天头部 -->
                <div class="h-14 border-b bg-white flex items-center px-6 shadow-sm z-10">
                    <input v-if="editingConvTitle !== null" v-model="editingConvTitle" @blur="saveEditConvTitle" @keyup.enter="saveEditConvTitle" class="font-bold text-lg text-slate-800 border-b-2 border-indigo-400 outline-none px-1" />
                    <span v-else @dblclick="startEditConvTitle" class="font-bold text-lg text-slate-800 cursor-pointer">{{ activeConvTitle }}</span>
                    <button v-if="editingConvTitle === null" @click="startEditConvTitle" class="ml-2 text-xs text-slate-400 hover:text-indigo-500 px-2 py-1 rounded hover:bg-indigo-50 transition">✏️</button>
                </div>

                <!-- 错误提示 -->
                <div v-if="errorMessage" class="bg-red-50 border-b border-red-100 px-6 py-2 text-red-500 text-sm">
                    {{ errorMessage }}
                </div>

                <!-- 消息列表 -->
                <div class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50" id="chat-box">
                    <div v-for="msg in currentMessages" :key="msg.id"
                         :class="['flex', msg.role === 'user' ? 'justify-end' : 'justify-start']">
                        <div :class="['max-w-[70%] rounded-2xl p-4 shadow-sm message-enter',
                                    msg.role === 'user' ? 'bg-gradient-to-br from-indigo-500 to-purple-500 text-white rounded-br-md' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-md']">

                            <p v-if="msg.msg_type === 'text'" class="whitespace-pre-wrap break-words" v-text="msg.content"></p>

                            <img v-if="msg.msg_type === 'image'" :src="getFullUrl(msg.content)" class="max-w-xs rounded-lg message-image" />

                            <audio v-if="msg.msg_type === 'audio'" :src="getFullUrl(msg.content)" controls class="mt-2"></audio>

                            <video v-if="msg.msg_type === 'video'" :src="getFullUrl(msg.content)" controls class="mt-2 max-w-full rounded-lg"></video>
                        </div>
                    </div>

                    <!-- 空状态 -->
                    <div v-if="currentMessages.length === 0" class="text-center text-slate-400 py-12">
                        <p class="text-5xl mb-4">💬</p>
                        <p class="text-lg">开始和 {{ activeConvTitle }} 聊天吧！</p>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="h-20 bg-white border-t p-4 flex items-center gap-4 shadow-lg">
                    <label class="cursor-pointer text-xl text-slate-400 hover:text-indigo-500 transition" title="发送媒体">
                        📎 <input type="file" class="hidden" @change="handleFileUpload" accept="image/*,audio/*,video/*" />
                    </label>
                    <input v-model="inputText" @keyup.enter="sendTextMessage" type="text"
                           class="flex-1 bg-slate-100 rounded-full px-5 py-2.5 outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white transition"
                           placeholder="输入消息...">
                    <button @click="sendTextMessage"
                            class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white px-6 py-2.5 rounded-full font-bold hover:shadow-lg hover:scale-105 transition transform">发送</button>
                </div>
            </template>

            <!-- 未选择会话 -->
            <div v-else class="flex-1 flex items-center justify-center text-slate-400 bg-slate-50">
                <div class="text-center">
                    <p class="text-6xl mb-4">💬</p>
                    <p class="text-lg">请在左侧选择或创建一个会话</p>
                </div>
            </div>
        </div>

        <!-- 创建 Robot 弹窗 -->
        <div v-if="showCreateRobotModal" class="modal-overlay" @click.self="showCreateRobotModal = false">
            <div class="modal-content">
                <h2 class="text-xl font-bold mb-4 text-slate-800">创建新 Robot</h2>
                <div class="mb-4">
                    <label class="block text-slate-600 text-sm font-medium mb-2">名称</label>
                    <input v-model="newRobotName" type="text" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400" placeholder="输入 Robot 名称">
                </div>
                <div class="mb-4">
                    <label class="block text-slate-600 text-sm font-medium mb-2">系统提示词（可选）</label>
                    <textarea v-model="newRobotSystemPrompt" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400" rows="4" placeholder="定义 Robot 的行为和角色..."></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button @click="showCreateRobotModal = false" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="createRobot" class="px-5 py-2 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-lg hover:shadow-md transition">创建</button>
                </div>
            </div>
        </div>

        <!-- 编辑 Robot 弹窗 -->
        <div v-if="showEditRobotModal" class="modal-overlay" @click.self="showEditRobotModal = false">
            <div class="modal-content">
                <h2 class="text-xl font-bold mb-4 text-slate-800">编辑 Robot</h2>
                <div class="mb-4">
                    <label class="block text-slate-600 text-sm font-medium mb-2">名称</label>
                    <input v-model="editingRobot.name" type="text" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400" placeholder="输入 Robot 名称">
                </div>
                <div class="mb-4">
                    <label class="block text-slate-600 text-sm font-medium mb-2">系统提示词</label>
                    <textarea v-model="editingRobot.system_prompt" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400" rows="4" placeholder="定义 Robot 的行为和角色..."></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button @click="showEditRobotModal = false" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button @click="saveEditRobot" class="px-5 py-2 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-lg hover:shadow-md transition">保存</button>
                </div>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
