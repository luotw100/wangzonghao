<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Agent 调试工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">

    <div id="app" class="w-full h-full flex" v-cloak>
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h1 class="text-lg font-bold text-gray-800">工作台</h1>
                <button @click="showCreateRobotModal = true" class="text-blue-500 hover:bg-blue-50 p-2 rounded">➕ Robot</button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <!-- Robot 列表 -->
                <div v-for="robot in robots" :key="robot.id" class="border-b">
                    <div class="p-3 bg-gray-100 text-sm font-semibold text-gray-600 flex justify-between items-center">
                        <span>{{ robot.name }}</span>
                        <button @click="createConversation(robot.id)" class="text-xs bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600">➕ 新会话</button>
                    </div>
                    <div v-for="conv in conversations.filter(c => c.robot_id === robot.id)" :key="conv.id"
                         @click="selectConversation(conv.id)"
                         :class="['p-3 border-b cursor-pointer hover:bg-gray-50', activeConvId === conv.id ? 'bg-blue-50' : '']">
                        <div class="font-medium text-gray-800">{{ conv.title }}</div>
                        <div class="text-xs text-gray-500 mt-1">{{ formatDate(conv.updated_at) }}</div>
                    </div>
                    <div v-if="conversations.filter(c => c.robot_id === robot.id).length === 0" class="p-3 text-gray-400 text-sm">
                        暂无会话
                    </div>
                </div>

                <!-- 无 Robot 时提示 -->
                <div v-if="robots.length === 0" class="p-4 text-center text-gray-400">
                    <p>还没有 Robot</p>
                    <p class="text-sm mt-1">点击右上角 ➕ Robot 创建</p>
                </div>
            </div>
        </div>

        <!-- 创建 Robot 弹窗 -->
        <div v-if="showCreateRobotModal" class="modal-overlay" @click.self="showCreateRobotModal = false">
            <div class="modal-content">
                <h2 class="text-xl font-bold mb-4">创建新 Robot</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">名称</label>
                    <input v-model="newRobotName" type="text" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400" placeholder="输入 Robot 名称">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">系统提示词（可选）</label>
                    <textarea v-model="newRobotSystemPrompt" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400" rows="4" placeholder="定义 Robot 的行为和角色..."></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button @click="showCreateRobotModal = false" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">取消</button>
                    <button @click="createRobot" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">创建</button>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-gray-50 relative">
            <template v-if="activeConvId">
                <div class="h-14 border-b bg-white flex items-center px-6 shadow-sm z-10">
                    <span class="font-bold text-lg">{{ activeConvTitle }}</span>
                </div>

                <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chat-box">
                    <div v-for="msg in currentMessages" :key="msg.id"
                         :class="['flex', msg.role === 'user' ? 'justify-end' : 'justify-start']">
                        <div :class="['max-w-[70%] rounded-lg p-3 shadow-sm message-enter',
                                    msg.role === 'user' ? 'bg-green-400 text-white' : 'bg-white border border-gray-200 text-gray-800']">

                            <p v-if="msg.msg_type === 'text'" class="whitespace-pre-wrap break-words" v-text="msg.content"></p>

                            <img v-if="msg.msg_type === 'image'" :src="getFullUrl(msg.content)" class="max-w-xs rounded message-image" />

                            <audio v-if="msg.msg_type === 'audio'" :src="getFullUrl(msg.content)" controls class="mt-2"></audio>

                            <video v-if="msg.msg_type === 'video'" :src="getFullUrl(msg.content)" controls class="mt-2 max-w-full"></video>
                        </div>
                    </div>

                    <!-- 空状态 -->
                    <div v-if="currentMessages.length === 0" class="text-center text-gray-400 py-8">
                        <p>开始和 {{ activeConvTitle }} 聊天吧！</p>
                    </div>
                </div>

                <div class="h-20 bg-white border-t p-4 flex items-center gap-3">
                    <label class="cursor-pointer text-2xl text-gray-400 hover:text-gray-600" title="发送图片">
                        📷 <input type="file" class="hidden" @change="handleFileUpload" accept="image/*,audio/*,video/*" />
                    </label>
                    <input v-model="inputText" @keyup.enter="sendTextMessage" type="text"
                           class="flex-1 bg-gray-100 rounded-full px-4 py-2 outline-none focus:ring-2 focus:ring-blue-400"
                           placeholder="输入消息...">
                    <button @click="sendTextMessage"
                            class="bg-blue-500 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-600 transition btn-hover">发送</button>
                </div>
            </template>

            <div v-else class="flex-1 flex items-center justify-center text-gray-400">
                <div class="text-center">
                    <p class="text-4xl mb-2">💬</p>
                    <p>请在左侧选择或创建一个会话</p>
                </div>
            </div>
        </div>

        </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
