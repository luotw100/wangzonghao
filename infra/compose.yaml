# Infrastructure compose — PostgreSQL + MinIO.
#
# Usage:
#   cd infra && docker compose up -d
#
# This starts shared Postgres and MinIO containers with host port mappings.
# Chat/Studio/Bridge connect via host.docker.internal + mapped ports.
# Start infra BEFORE starting any service compose.
#
# For cloud deployments, replace PG/MinIO with managed services and
# update the .env files in each service.

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_ALLOW_CORS: "true"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-create-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/studio;
      mc mb --ignore-existing local/chat;
      "
    restart: "no"

  studio-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STUDIO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STUDIO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${STUDIO_POSTGRES_DB}
    volumes:
      - studio-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STUDIO_POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  chat-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CHAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CHAT_POSTGRES_DB}
    volumes:
      - chat-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAT_POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped

volumes:
  studio-pgdata:
  chat-pgdata:
  minio-data:
  pgadmin-data:

