server {
    listen 23456;
    server_name localhost;

    client_max_body_size 50m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Storage attachments (e.g. base64 image disk path)
    location /storage/ {
        alias /app/storage/;
        try_files $uri =404;
    }

    location /api/robot/ {
        proxy_pass http://robot-api:23457/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://chat:23456/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
