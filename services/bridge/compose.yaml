# Bridge daemon compose — meant to run on the streamer's PC.
#
# A single Bridge daemon multiplexes N inboxes (one or more platform logins
# co-located on this machine). Configuration lives in a local TOML file
# (NOT env vars), so platform credentials never travel through Studio.
#
# Setup:
#   1. Copy bridge.toml.example -> bridge.toml in this directory
#   2. Fill in studio_url + token (from Studio UI) and per-inbox blocks
#   3. docker compose up --build
#
# When Studio runs in another compose on the same host, point studio_url
# at host.docker.internal:<published-port> in your bridge.toml.

services:
  bridge:
    build:
      context: .
    volumes:
      - ./bridge.toml:/app/bridge.toml:ro
    environment:
      BRIDGE_CONFIG: /app/bridge.toml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
