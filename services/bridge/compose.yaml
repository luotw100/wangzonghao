# Bridge daemon compose — runs on the streamer's PC.
#
# Zero config files. Pass everything on the command line. Get the exact
# command to run from Studio's Bridge detail page (it includes your token
# and the chat logins you've ticked).
#
#   docker compose run --rm bridge \
#     --token=YOUR_TOKEN \
#     --chat-inbox 'base_url=https://chat.laborster.com,username=alice,password=...'
#
# The Studio URL is hardcoded to https://studio.laborster.com inside the
# daemon. To point at a non-prod Studio (e.g. local dev), edit STUDIO_URL
# in bridge/main.py.

services:
  bridge:
    build:
      context: .
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: "no"
