# Bridge daemon compose — runs on the streamer's PC.
#
# No tokens, no Studio Bridge page. Pass your Studio account credentials and
# the chat logins you want this bridge to serve. Studio auto-registers a
# Bridge row keyed by (account, hostname).
#
#   docker compose run --rm bridge \
#     --studio-username=alice \
#     --studio-password=YOUR_PASSWORD \
#     --chat-inbox 'base_url=https://chat.laborster.com,username=alice,password=...'
#
# The Studio URL defaults to https://studio.laborster.com. Pass --studio-url
# to point at a non-prod Studio (e.g. http://host.docker.internal:23457 for
# local dev).

services:
  bridge:
    build:
      context: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: "no"
