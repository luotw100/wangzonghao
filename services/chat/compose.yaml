services:
  chat-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - 23456:23456
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      chat-api:
        condition: service_started
      chat-db:
        condition: service_healthy
    restart: unless-stopped

  chat-api:
    build:
      context: ./api
    environment:
      CHAT_STORAGE_DIR: /app/storage
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - chat-storage:/app/storage
    depends_on:
      chat-db:
        condition: service_healthy
    restart: unless-stopped

  chat-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

volumes:
  chat-storage:
  chat-pgdata: