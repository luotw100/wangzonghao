services:
  chat-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - 23456:23456
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chat-api
    restart: unless-stopped

  chat-api:
    build:
      context: ./api
    environment:
      CHAT_STORAGE_DIR: /app/storage
    volumes:
      - chat-storage:/app/storage
    restart: unless-stopped

volumes:
  chat-storage:
