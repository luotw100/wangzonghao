services:
  robot-web:
    build:
      context: ./web
    ports:
      - 23457:23457
    volumes:
      - ./storage:/app/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - robot-api
    restart: unless-stopped

  robot-api:
    build:
      context: ./api
    environment:
      ROBOT_STORAGE_DIR: /app/storage
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  robot-worker:
    build:
      context: ./api
    command: ["uv", "run", "python", "-m", "robot.worker", "--request-timeout", "120"]
    environment:
      ROBOT_STORAGE_DIR: /app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      - robot-api
    restart: unless-stopped
