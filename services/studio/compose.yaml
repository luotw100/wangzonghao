services:
  studio-web:
    build:
      context: ./web
    ports:
      - 23457:23457
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      studio-api:
        condition: service_started
      studio-db:
        condition: service_healthy
    restart: unless-stopped

  studio-api:
    build:
      context: ./api
    environment:
      STUDIO_STORAGE_DIR: /app/storage
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - studio-storage:/app/storage
    depends_on:
      studio-db:
        condition: service_healthy
    restart: unless-stopped

  studio-worker:
    build:
      context: ./api
    command: ["uv", "run", "python", "-m", "studio.worker", "--request-timeout", "120"]
    environment:
      STUDIO_STORAGE_DIR: /app/storage
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - studio-storage:/app/storage
    depends_on:
      studio-db:
        condition: service_healthy
    restart: unless-stopped

  studio-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - studio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

volumes:
  studio-storage:
  studio-pgdata