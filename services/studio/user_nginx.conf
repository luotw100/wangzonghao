server {
    listen 23456;
    server_name localhost;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /storage/ {
        return 404;
    }

    # Single React SPA: /, /studio, /chat all fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI (mounts both studio + /api/chat/* routes).
    location /api/ {
        proxy_pass http://user-api:23456/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /api/chat/conversations/{id}/messages/after is a long poll —
        # let the LISTEN/NOTIFY broker take its time before returning.
        proxy_read_timeout 120s;
    }
}
