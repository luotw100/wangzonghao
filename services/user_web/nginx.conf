# Pooled, reused connections to the API. Without this, every /api/ request
# opened a fresh TCP to user-api → under load the sockets piled up in
# TIME_WAIT and exhausted ephemeral ports ("Address not available" → 502).
# keepalive caps the idle pool per worker; the upstream still opens more
# active connections under burst. The idle timeout (default 60s) stays BELOW
# uvicorn's --timeout-keep-alive (75s) so nginx is always the side that closes
# an idle connection — avoids reusing one the API has already shut.
upstream user_api {
    server user-api:23456;
    keepalive 64;
}

server {
    listen 23456;
    server_name localhost;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /storage/ {
        return 404;
    }

    # Single React SPA: /, /studio, /chat all fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI (mounts both studio + /api/chat/* routes).
    location /api/ {
        proxy_pass http://user_api/api/;
        # HTTP/1.1 + cleared Connection header are required for upstream
        # keepalive to engage (default proxy uses 1.0 + Connection: close).
        # NOTE: blanket Connection "" is fine while /api/* is plain HTTP
        # long-poll. If a WebSocket route is added, switch to a
        # $connection_upgrade map so the Upgrade handshake survives.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /api/chat/conversations/{id}/messages/after is a long poll —
        # let the LISTEN/NOTIFY broker take its time before returning.
        proxy_read_timeout 120s;
    }
}
